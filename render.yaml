services:
  - type: web
    name: fb-post-pro
    runtime: python
    region: oregon
    # Always-on instance avoids scheduler/worker polling delays caused by free-tier sleep.
    plan: 0.5c-512mb

    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/deploy_preflight.py && gunicorn app:app --workers 1 --threads 8 --timeout 120 --access-logfile - --error-logfile - --max-requests 2000 --max-requests-jitter 200

    healthCheckPath: /ready
    # Deploy manually after the documented pre-migration backup step.
    autoDeployTrigger: off

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: APP_ENV
        value: production

      - key: TRUST_PROXY_HEADERS
        value: "true"

      - key: ENABLE_LEGACY_ADMIN_AUTH
        value: "false"
      # Comma-separated usernames or emails granted role=admin automatically upon registration or startup
      - key: ADMIN_USERNAMES
        value: ""
      - key: ADMIN_EMAILS
        value: ""
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SCHEDULER_POLL_SECONDS
        value: "15"
      - key: DEVICE_TOKEN_TTL_DAYS
        value: "90"
      - key: LEGACY_DEVICE_TOKEN_GRACE_DAYS
        value: "30"
      # Custom domains: add hostnames to this variable in the Render dashboard.
      # RENDER_EXTERNAL_HOSTNAME is included automatically by the application.
      - key: ALLOWED_HOSTS
        value: ""

      - key: SESSION_LIFETIME_HOURS
        value: "12"

      - key: OPERATIONAL_LOG_RETENTION_DAYS
        value: "30"

      - key: AUDIT_LOG_RETENTION_DAYS
        value: "365"

      - key: LOG_CLEANUP_BATCH_SIZE
        value: "10000"

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: DATA_ROOT
        # Transient cache/local recovery only. Durable production data is PostgreSQL.
        value: /tmp/fbpostpro

      - key: DATABASE_URL
        fromDatabase:
          name: medicare-database
          property: connectionString
