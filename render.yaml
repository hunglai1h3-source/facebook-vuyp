services:
  - type: web
    name: fb-post-pro
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_ROOT
        value: /tmp/fbpostpro
      - key: DATABASE_URL
        fromDatabase:
          name: fb-post-pro-db
          property: connectionString

databases:
  - name: fb-post-pro-db
    region: singapore
    plan: free
